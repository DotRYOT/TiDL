# TidalDL - Nginx Configuration for Arch Linux
# 
# Installation:
#   sudo cp nginx-tidaldl.conf /etc/nginx/conf.d/tidaldl.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, add SSL configuration or use certbot:
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name localhost;    # Change to your domain/IP
    
    # Document root - points to the built frontend
    root /srv/http/tidaldl/dist;
    index index.html;
    
    # Logging
    access_log /var/log/nginx/tidaldl_access.log;
    error_log /var/log/nginx/tidaldl_error.log;
    
    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # PHP API endpoints
    location ~ ^/api/.*\.php$ {
        root /srv/http/tidaldl/dist;
        
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Extended timeouts for large downloads
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 60;
        
        # Buffer settings for streaming responses
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        
        # Disable buffering for SSE (Server-Sent Events)
        fastcgi_buffering off;
    }
    
    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to PHP files outside /api/
    location ~ \.php$ {
        deny all;
    }
    
    # Block access to sensitive files
    location ~* \.(md|txt|log|sql|bak|conf)$ {
        deny all;
    }
    
    # Client body size for uploads
    client_max_body_size 100M;
}

